<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f2" />
    <title>FitPlan 雲端食物庫</title>
    <link rel="stylesheet" href="styles.css?v=20261113-track" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="title-block">
          <p id="pageKicker">雲端</p>
          <h1>食物庫狀態</h1>
        </div>
        <a class="btn" href="index.html">返回 FitPlan</a>
      </header>
      <section class="panel">
        <div class="section-head">
          <h2>同步狀態</h2>
          <span id="backendCount">0 項</span>
        </div>
        <p id="backendSyncStatus" class="muted">使用本機預設食物庫。</p>
        <p class="muted">食物庫由 Supabase Dashboard 維護。輸入時可填每 1 顆、每 1 包或每 250ml，資料庫會換算成每 100g 供前台計算。</p>
      </section>
      <section class="panel">
        <div class="section-head">
          <h2>食物清單</h2>
        </div>
        <div id="backendFoodDatabase" class="stack"></div>
      </section>
    </main>
    <script src="food-basis.js?v=20261113-track"></script>
    <script src="supabase-config.js?v=20261113-track"></script>
    <script src="supabase-foods.js?v=20261113-track"></script>
